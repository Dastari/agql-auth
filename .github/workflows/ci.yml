name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      target_ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  consumer-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: agql_test
          POSTGRES_PASSWORD: agql_test
          POSTGRES_DB: agql_conformance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agql_test -d agql_conformance"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.target_ref || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4aab473fa1157d90c6dc14f879ca54797e16fea0 # 1.90.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install consumer fixture tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run the same contract against SQLite and PostgreSQL
        env:
          AGQL_AUTH_TEST_POSTGRES_URL: postgresql://agql_test:agql_test@127.0.0.1:5432/agql_conformance
        run: |
          cargo test --locked password_login_consumer_conformance -- --ignored
          cargo test --locked refresh_reuse_grace_consumer_conformance -- --ignored

  dependency-advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.target_ref || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4aab473fa1157d90c6dc14f879ca54797e16fea0 # 1.90.0
      - name: Audit Cargo.lock against the RustSec advisory database
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          # Ignored advisories and their dispositions: .cargo/audit.toml and
          # docs/dependency-advisories.md.
          cargo audit --deny warnings

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.target_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4aab473fa1157d90c6dc14f879ca54797e16fea0 # 1.90.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Validate release metadata and formatting
        run: |
          scripts/check-release-state.sh
          scripts/check-package-release-policy.sh
          python3 -m unittest discover -s scripts -p 'test_*.py'
          cargo fmt --all -- --check
      - name: Validate crate
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          set -euo pipefail
          # The crate has no Cargo features (scripts/release.py enforces it), so a
          # --no-default-features lane would repeat this one.
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo doc --locked --no-deps
